[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinassist"
version = "0.0.1"
description = "Offline desktop clinical consultation assistant: local speech-to-text and quantized MedGemma."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyspellchecker>=0.8", "psutil>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "psutil>=6"]
storage = ["sqlcipher3>=0.5", "argon2-cffi>=23.1", "cryptography>=42"]
audio = ["sounddevice>=0.5"]
asr = ["faster-whisper>=1.1"]
ui = ["PySide6>=6.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["hardware: needs a real microphone; run with CLINASSIST_HARDWARE=1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/model_outputs.py" = ["E501"]  # real model outputs kept verbatim
